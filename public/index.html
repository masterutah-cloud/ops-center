const fmtMoney = (n) => "$" + (Number(n) || 0).toLocaleString(undefined, { maximumFractionDigits: 0 });
const fmtDate = (d) => {
  if (!d) return "—";
  const dt = new Date(d + "T00:00:00");
  return isNaN(dt) ? d : dt.toLocaleDateString(undefined, { month: "short", day: "numeric" });
};
const todayStr = () => new Date().toISOString().slice(0, 10);

// ---------- API layer (this is the whole point of the rewrite: real HTTP
// status codes mean "empty" and "broken" are never ambiguous again) ----------
async function apiLoad() {
  const res = await fetch("/api/jobs");
  if (!res.ok) throw new Error("load failed: " + res.status);
  return await res.json();
}

  const res = await fetch("/api/jobs", {

}

const RETRY_SCHEDULE = [2000, 4000, 8000, 15000];

// ---------- Takeoff geometry (verified separately with unit tests before wiring into the UI) ----------
function polylineLength(points) {
  let total = 0;
  for (let i = 1; i < points.length; i++) {
    const dx = points[i].x - points[i - 1].x, dy = points[i].y - points[i - 1].y;
    total += Math.sqrt(dx * dx + dy * dy);
  }
  return total;
}
function polygonArea(points) {
  let sum = 0;
  const n = points.length;
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n;
    sum += points[i].x * points[j].y - points[j].x * points[i].y;
  }
  return Math.abs(sum) / 2;
}
function pointToSegmentDist(p, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const lenSq = dx * dx + dy * dy;
  if (lenSq === 0) return Math.hypot(p.x - a.x, p.y - a.y);
  let t = ((p.x - a.x) * dx + (p.y - a.y) * dy) / lenSq;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
}
function pointInPolygon(p, pts) {
  let inside = false;
  for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
    const xi = pts[i].x, yi = pts[i].y, xj = pts[j].x, yj = pts[j].y;
    const intersect = (yi > p.y) !== (yj > p.y) && p.x < ((xj - xi) * (p.y - yi)) / (yj - yi) + xi;
    if (intersect) inside = !inside;
  }
  return inside;
}
// Used by Select/Edit mode to determine which measurement (if any) a click landed on.
function hitTestMeasurement(m, x, y, threshold) {
  if (m.type === "count") return m.points.some(p => Math.hypot(p.x - x, p.y - y) < threshold);
  if (m.type === "area") return pointInPolygon({ x, y }, m.points) || m.points.some((p, i) => pointToSegmentDist({ x, y }, p, m.points[(i + 1) % m.points.length]) < threshold);
  for (let i = 1; i < m.points.length; i++) if (pointToSegmentDist({ x, y }, m.points[i - 1], m.points[i]) < threshold) return true;
  return false;
}

// PDF documents are loaded once and cached by URL, so navigating between pages
// doesn't re-fetch the whole file — only re-renders the requested page.
const pdfDocCache = new Map();
async function loadPdfDoc(url) {
  if (pdfDocCache.has(url)) return pdfDocCache.get(url);
  if (!window.pdfjsLib) throw new Error("PDF viewer library didn't load — check your connection and reload.");
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://unpkg.com/pdfjs-dist@3.11.174/legacy/build/pdf.worker.min.js";
  const pdf = await window.pdfjsLib.getDocument(url).promise;
  pdfDocCache.set(url, pdf);
  return pdf;
}
// Renders a specific page (1-indexed) of a PDF to a data URL for display/measuring,
// and returns the total page count so the UI can offer page navigation. `scale`
// defaults to 2 for the main measuring view; thumbnails pass a much smaller scale
// (e.g. 0.25) since they're only ever shown a few dozen pixels wide.
async function renderPdfPageToDataUrl(url, pageNum, scale = 2) {
  const pdf = await loadPdfDoc(url);
  const page = await pdf.getPage(pageNum);
  const viewport = page.getViewport({ scale });
  const canvas = document.createElement("canvas");
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
  return { dataUrl: canvas.toDataURL("image/png"), numPages: pdf.numPages };
}

const EXPENSE_CATEGORIES = ["Labor", "Materials", "Other"];
const CLASS_COLORS = ["#E2600C", "#4A7856", "#2B5D8C", "#D9A02E", "#8E44AD", "#C0392B", "#16A085", "#7F5539"];
const EXPENSE_COLOR = { "Labor": "#2B5D8C", "Materials": "#D9A02E", "Other": "#8A8577" };

// Uploads a file to the server (which forwards it to the configured bucket).
// Returns { key, url, name, type } on success, or throws with a friendly message.
async function apiUpload(file) {
  const form = new FormData();
  form.append("file", file);
  const res = await fetch("/api/upload", { method: "POST", body: form });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Upload failed");
  return data;
}

// ---------- tiny inline icon set (no external icon deps) ----------
const Icon = ({ d, size = 14, color = "currentColor" }) => (

);

const IDownload = (p) => <Icon {...p} d={<><path d="M12 3v12m0 0-4-4m4 4 4-4"/><path d="M4 21h16"/></>} />;
const IUpload = (p) => <Icon {...p} d={<><path d="M12 21V9m0 0 4 4m-4-4-4 4"/><path d="M4 3h16"/></>} />;
const ICamera = (p) => <Icon {...p} d={<><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2Z"/><circle cx="12" cy="13" r="4"/></>} />;

const IRuler = (p) => <Icon {...p} d={<><path d="m16.5 21.5-14-14a2 2 0 0 1 0-2.8L4.7 2.5a2 2 0 0 1 2.8 0l14 14a2 2 0 0 1 0 2.8l-2.2 2.2a2 2 0 0 1-2.8 0Z"/><path d="m7.5 10.5 2-2M10.5 13.5l2-2M13.5 16.5l2-2"/></>} />;
const IOpenEye = (p) => <Icon {...p} d={<><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></>} />;
const ISelect = (p) => <Icon {...p} d={<path d="M4 3l7 17 2.2-6.8L20 11 4 3Z"/>} />;

function Gauge({ value = 0, color = "#2B5D8C" }) {
  const pct = Math.max(0, Math.min(100, value));
  return (
    <div>
      <div style={{ position: "relative", height: 10, background: "#E4E1D6", borderRadius: 2, overflow: "hidden", border: "1px solid #D7D3C5" }}>
        <div style={{ position: "absolute", inset: 0, width: pct + "%", background: color, transition: "width .3s ease" }} />
      </div>
      <div style={{ fontFamily: "'IBM Plex Mono', monospace" }} className="text-[11px] mt-1 text-[#5B6470]">{pct}% complete</div>
    </div>
  );
}
function StatusStamp({ status }) {
  const color = STATUS_COLOR[status] || "#5B6470";
  return (
    <div style={{ color, borderColor: color, fontFamily: "'Oswald', sans-serif", transform: "rotate(-7deg)" }}
      className="absolute top-2 right-2 border-2 rounded-sm px-1.5 py-0.5 text-[9px] tracking-widest uppercase font-semibold opacity-80 select-none">
      {status}
    </div>
  );
}
function PunchHole() {
  return <div className="absolute top-2 left-2 w-3 h-3 rounded-full" style={{ background: "#EEEDE6", border: "1px solid #C9C5B8", boxShadow: "inset 0 1px 2px rgba(0,0,0,0.25)" }} />;
}
function EmptyState({ icon: Ic, title, subtitle, actionLabel, onAction }) {
  return (
    <div className="border-2 border-dashed rounded-sm p-8 text-center" style={{ borderColor: "#C9C5B8" }}>
      <div className="flex justify-center mb-2" style={{ color: "#8A8577" }}><Ic size={22} /></div>
      <div className="font-semibold text-sm" style={{ color: "#1A2332" }}>{title}</div>
      {subtitle && <div className="text-xs mt-1" style={{ color: "#8A8577" }}>{subtitle}</div>}
      {actionLabel && (
        <button onClick={onAction} className="mt-4 inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold uppercase tracking-wide rounded-sm text-white" style={{ background: "#E2600C" }}>
          <IPlus size={14} /> {actionLabel}
        </button>
      )}
    </div>
  );
}

function JobCard({ job, onOpen }) {
  const openTasks = (job.tasks || []).filter(t => !t.done).length;
  const overdue = job.dueDate && job.dueDate < todayStr() && job.status !== "Complete";
  return (
    <button onClick={() => onOpen(job.id)}
      className="relative w-full text-left bg-white border-2 border-dashed rounded-sm p-3.5 pt-6 mb-3 hover:shadow-md transition-shadow"
      style={{ borderColor: overdue ? "#E2600C" : "#C9C5B8" }}>
      <PunchHole />
      <StatusStamp status={job.status} />
      <div style={{ fontFamily: "'Oswald', sans-serif" }} className="uppercase text-[13px] font-semibold leading-tight pr-16">{job.name || "Untitled job"}</div>
      <div className="text-xs mt-0.5" style={{ color: "#5B6470" }}>{job.client || "No client set"}</div>
      {job.address && (
        <div className="flex items-center gap-1 text-[11px] mt-2" style={{ color: "#8A8577" }}>
          <IMap size={11} /> <span className="truncate">{job.address}</span>
        </div>
      )}
      <div className="mt-3"><Gauge value={job.progress || 0} color={STATUS_COLOR[job.status]} /></div>
      <div className="flex items-center justify-between mt-3 pt-2 border-t" style={{ borderColor: "#EEEDE6" }}>
        <div style={{ fontFamily: "'IBM Plex Mono', monospace" }} className="text-[11px]">{fmtMoney(job.estimate?.amount)}</div>
        <div className="flex items-center gap-2 text-[11px]" style={{ color: overdue ? "#E2600C" : "#8A8577" }}>
          {openTasks > 0 && <span className="flex items-center gap-0.5"><IList size={11} />{openTasks}</span>}
          <span>{overdue ? "Overdue" : fmtDate(job.dueDate)}</span>
        </div>
      </div>
    </button>
  );
}

function PriceBookModal({ items, onChange, onClose }) {
  const [form, setForm] = useState({ name: "", unit: "ft", unitCost: "" });

  const addItem = () => {
    if (!form.name.trim() || !form.unitCost) return;
    onChange([...items, { id: uid(), name: form.name.trim(), unit: form.unit, unitCost: Number(form.unitCost) || 0 }]);
    setForm({ name: "", unit: "ft", unitCost: "" });
  };
  const removeItem = (id) => onChange(items.filter(i => i.id !== id));
  const updateItem = (id, patch) => onChange(items.map(i => i.id === id ? { ...i, ...patch } : i));

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(26,35,50,0.55)" }}>
      <div className="bg-white rounded-sm w-full max-w-lg max-h-[85vh] overflow-hidden flex flex-col">
        <div className="p-4 border-b flex items-center justify-between" style={{ borderColor: "#EEEDE6" }}>
          <div>
            <h3 style={{ fontFamily: "'Oswald', sans-serif" }} className="uppercase font-semibold text-base">Price book</h3>
            <p className="text-xs mt-0.5" style={{ color: "#8A8577" }}>Shared across all jobs — used in the Takeoff tool to turn measured quantities into dollar costs.</p>
          </div>
          <button onClick={onClose}><IX size={18} /></button>
        </div>
        <div className="p-4 overflow-y-auto flex-1">
          <div className="grid grid-cols-4 gap-2 mb-4">
            <input value={form.name} onChange={(e) => setForm(f => ({ ...f, name: e.target.value }))} placeholder="Item name (e.g. Curb)"
              className="col-span-2 px-2.5 py-2 border rounded-sm text-sm" style={{ borderColor: "#C9C5B8" }} />
            <select value={form.unit} onChange={(e) => setForm(f => ({ ...f, unit: e.target.value }))}
              className="px-2.5 py-2 border rounded-sm text-sm bg-white" style={{ borderColor: "#C9C5B8" }}>
              <option value="ft">$/ft</option>
              <option value="sq ft">$/sq ft</option>
              <option value="count">$/each</option>
            </select>
            <input type="number" value={form.unitCost} onChange={(e) => setForm(f => ({ ...f, unitCost: e.target.value }))} placeholder="Cost"
              className="px-2.5 py-2 border rounded-sm text-sm" style={{ borderColor: "#C9C5B8" }} />
          </div>
          <button onClick={addItem} className="w-full py-2 rounded-sm text-white text-xs font-semibold uppercase tracking-wide mb-4" style={{ background: "#2B5D8C" }}>Add item</button>

          {items.length === 0 ? (
            <EmptyState icon={IDollar} title="No items yet" subtitle="Add unit costs for the materials/labor items you measure most often." />
          ) : (
            <div className="space-y-1.5">
              {items.map(i => (
                <div key={i.id} className="flex items-center gap-2 px-2.5 py-2 border rounded-sm" style={{ borderColor: "#EEEDE6" }}>
                  <input value={i.name} onChange={(e) => updateItem(i.id, { name: e.target.value })} className="flex-1 min-w-0 px-2 py-1 border rounded-sm text-sm" style={{ borderColor: "#EEEDE6" }} />
                  <select value={i.unit} onChange={(e) => updateItem(i.id, { unit: e.target.value })} className="px-2 py-1 border rounded-sm text-sm bg-white" style={{ borderColor: "#EEEDE6" }}>
                    <option value="ft">$/ft</option>
                    <option value="sq ft">$/sq ft</option>
                    <option value="count">$/each</option>
                  </select>
                  <input type="number" value={i.unitCost} onChange={(e) => updateItem(i.id, { unitCost: Number(e.target.value) || 0 })} className="w-20 px-2 py-1 border rounded-sm text-sm" style={{ borderColor: "#EEEDE6" }} />
                  <button onClick={() => removeItem(i.id)}><IX size={14} color="#8A8577" /></button>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function NewJobModal({ onClose, onCreate }) {
  const [form, setForm] = useState({ name: "", client: "", address: "", status: "Estimate", startDate: todayStr(), dueDate: "", estimateAmount: "" });
  const set = (k) => (e) => setForm(f => ({ ...f, [k]: e.target.value }));
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(26,35,50,0.55)" }}>
      <div className="bg-white rounded-sm w-full max-w-md p-5 max-h-[85vh] overflow-y-auto">
        <div className="flex items-center justify-between mb-4">
          <h3 style={{ fontFamily: "'Oswald', sans-serif" }} className="uppercase font-semibold text-base">New job</h3>
          <button onClick={onClose}><IX size={18} /></button>
        </div>
        <div className="space-y-3">
          <div><label className="text-[11px] uppercase tracking-wide font-semibold" style={{ color: "#5B6470" }}>Job name</label>
            <input value={form.name} onChange={set("name")} placeholder="e.g. Maple St. Kitchen Remodel" className="w-full mt-1 px-2.5 py-2 border rounded-sm text-sm" style={{ borderColor: "#C9C5B8" }} /></div>
          <div><label className="text-[11px] uppercase tracking-wide font-semibold" style={{ color: "#5B6470" }}>Client</label>
            <input value={form.client} onChange={set("client")} placeholder="Client name" className="w-full mt-1 px-2.5 py-2 border rounded-sm text-sm" style={{ borderColor: "#C9C5B8" }} /></div>
          <div><label className="text-[11px] uppercase tracking-wide font-semibold" style={{ color: "#5B6470" }}>Address</label>
            <input value={form.address} onChange={set("address")} placeholder="Job site address" className="w-full mt-1 px-2.5 py-2 border rounded-sm text-sm" style={{ borderColor: "#C9C5B8" }} /></div>
          <div className="grid grid-cols-2 gap-3">
            <div><label className="text-[11px] uppercase tracking-wide font-semibold" style={{ color: "#5B6470" }}>Start date</label>
              <input type="date" value={form.startDate} onChange={set("startDate")} className="w-full mt-1 px-2.5 py-2 border rounded-sm text-sm" style={{ borderColor: "#C9C5B8" }} /></div>
            <div><label className="text-[11px] uppercase tracking-wide font-semibold" style={{ color: "#5B6470" }}>Due date</label>
              <input type="date" value={form.dueDate} onChange={set("dueDate")} className="w-full mt-1 px-2.5 py-2 border rounded-sm text-sm" style={{ borderColor: "#C9C5B8" }} /></div>
          </div>

            <div><label className="text-[11px] uppercase tracking-wide font-semibold" style={{ color: "#5B6470" }}>Status</label>
              <select value={form.status} onChange={set("status")} className="w-full mt-1 px-2.5 py-2 border rounded-sm text-sm bg-white" style={{ borderColor: "#C9C5B8" }}>
                {STATUSES.map(s => <option key={s} value={s}>{s}</option>)}
              </select></div>
            <div><label className="text-[11px] uppercase tracking-wide font-semibold" style={{ color: "#5B6470" }}>Estimate ($)</label>
              <input type="number" value={form.estimateAmount} onChange={set("estimateAmount")} placeholder="0" className="w-full mt-1 px-2.5 py-2 border rounded-sm text-sm" style={{ borderColor: "#C9C5B8" }} /></div>
          </div>
        </div>
        <div className="flex gap-2 mt-5">
          <button onClick={onClose} className="flex-1 px-3 py-2 text-sm font-semibold rounded-sm border" style={{ borderColor: "#C9C5B8", color: "#5B6470" }}>Cancel</button>
          <button onClick={() => {
            if (!form.name.trim()) return;
            onCreate({
              id: uid(), name: form.name.trim(), client: form.client.trim(), address: form.address.trim(),
              status: form.status, startDate: form.startDate, dueDate: form.dueDate, progress: 0,
              estimate: { amount: Number(form.estimateAmount) || 0, status: "Draft" },
              tasks: [], appointments: [], notes: "", expenses: [], files: [], takeoffSheets: [], takeoffMeasurements: [],
            });
          }} className="flex-1 px-3 py-2 text-sm font-semibold rounded-sm text-white uppercase tracking-wide" style={{ background: "#E2600C" }}>
            Create job
          </button>
        </div>
      </div>
    </div>
  );
}

function JobModal({ job, onClose, onUpdate, onDelete, priceBook }) {
  const [tab, setTab] = useState("details");
  const [newTask, setNewTask] = useState("");
  const [newTaskAssignee, setNewTaskAssignee] = useState("");
  const [newAppt, setNewAppt] = useState({ title: "", date: todayStr(), time: "09:00", type: "Site Visit" });
  const update = (patch) => onUpdate({ ...job, ...patch });
  const addTask = () => {
    if (!newTask.trim()) return;
    update({ tasks: [...(job.tasks || []), { id: uid(), text: newTask.trim(), done: false, assignee: newTaskAssignee.trim(), due: "" }] });
    setNewTask(""); setNewTaskAssignee("");
  };
  const toggleTask = (id) => update({ tasks: job.tasks.map(t => t.id === id ? { ...t, done: !t.done } : t) });
  const removeTask = (id) => update({ tasks: job.tasks.filter(t => t.id !== id) });
  const addAppt = () => {
    if (!newAppt.title.trim()) return;
    update({ appointments: [...(job.appointments || []), { id: uid(), ...newAppt, title: newAppt.title.trim() }] });
    setNewAppt({ title: "", date: todayStr(), time: "09:00", type: "Site Visit" });
  };
  const removeAppt = (id) => update({ appointments: job.appointments.filter(a => a.id !== id) });

  // ---- P&L: expenses + project files ----
  const [newExpense, setNewExpense] = useState({ category: "Labor", description: "", amount: "", date: todayStr() });
  const [uploadingExpenseReceipt, setUploadingExpenseReceipt] = useState(false);
  const [uploadingFile, setUploadingFile] = useState(false);
  const [uploadError, setUploadError] = useState("");
  const expenseReceiptInputRef = useRef(null);
  const projectFileInputRef = useRef(null);

  const addExpense = () => {
    if (!newExpense.description.trim() || !newExpense.amount) return;
    update({
      expenses: [...(job.expenses || []), {
        id: uid(), category: newExpense.category, description: newExpense.description.trim(),
        amount: Number(newExpense.amount) || 0, date: newExpense.date, receipt: null,
      }],
    });
    setNewExpense({ category: "Labor", description: "", amount: "", date: todayStr() });
  };
  const removeExpense = async (id) => {
    const exp = (job.expenses || []).find(e => e.id === id);
    update({ expenses: job.expenses.filter(e => e.id !== id) });
    if (exp?.receipt?.key) { try { await fetch("/api/upload/" + exp.receipt.key, { method: "DELETE" }); } catch (e) {} }
  };
  const attachReceipt = async (expenseId, file) => {
    setUploadError(""); setUploadingExpenseReceipt(expenseId);
    try {
      const uploaded = await apiUpload(file);
      update({ expenses: job.expenses.map(e => e.id === expenseId ? { ...e, receipt: uploaded } : e) });
    } catch (e) {
      setUploadError(e.message || "Couldn't upload that receipt.");
    } finally {
      setUploadingExpenseReceipt(false);
    }
  };
  const addProjectFile = async (file) => {
    setUploadError(""); setUploadingFile(true);
    try {
      const uploaded = await apiUpload(file);
      update({ files: [...(job.files || []), { ...uploaded, id: uid(), uploadedAt: new Date().toISOString() }] });
    } catch (e) {
      setUploadError(e.message || "Couldn't upload that file.");
    } finally {
      setUploadingFile(false);
    }
  };
  const removeProjectFile = async (id) => {
    const f = (job.files || []).find(f => f.id === id);
    update({ files: (job.files || []).filter(f => f.id !== id) });
    if (f?.key) { try { await fetch("/api/upload/" + f.key, { method: "DELETE" }); } catch (e) {} }
  };

  // ---- Takeoff: plan sheets + measurements ----
  const [uploadingSheet, setUploadingSheet] = useState(false);
  const [activeSheetId, setActiveSheetId] = useState(null);
  const sheetInputRef = useRef(null);
  const takeoffSheets = job.takeoffSheets || [];
  const takeoffMeasurements = job.takeoffMeasurements || [];
  const takeoffClasses = job.takeoffClasses || [];
  const activeSheet = takeoffSheets.find(s => s.id === activeSheetId);

  const addClass = (name, unit) => {
    const color = CLASS_COLORS[takeoffClasses.length % CLASS_COLORS.length];
    const cls = { id: uid(), name: name.trim(), unit, color };
    update({ takeoffClasses: [...takeoffClasses, cls] });
    return cls;
  };
  const deleteClass = (id) => update({ takeoffClasses: takeoffClasses.filter(c => c.id !== id) });

  const uploadSheet = async (file) => {
    setUploadError(""); setUploadingSheet(true);
    try {
      const uploaded = await apiUpload(file);
      update({ takeoffSheets: [...takeoffSheets, { ...uploaded, id: uid(), scales: {} }] });
    } catch (e) {
      setUploadError(e.message || "Couldn't upload that sheet.");
    } finally {
      setUploadingSheet(false);
    }
  };
  const removeSheet = async (id) => {
    const s = takeoffSheets.find(s => s.id === id);
    update({ takeoffSheets: takeoffSheets.filter(s => s.id !== id), takeoffMeasurements: takeoffMeasurements.filter(m => m.sheetId !== id) });
    if (s?.key) { try { await fetch("/api/upload/" + s.key, { method: "DELETE" }); } catch (e) {} }
  };
  const setSheetScale = (sheetId, page, pixelsPerFoot) => update({ takeoffSheets: takeoffSheets.map(s => s.id === sheetId ? { ...s, scales: { ...(s.scales || {}), [page]: pixelsPerFoot } } : s) });
  const saveMeasurement = (m) => update({ takeoffMeasurements: [...takeoffMeasurements, m] });
  const updateMeasurement = (id, patch) => update({ takeoffMeasurements: takeoffMeasurements.map(m => m.id === id ? { ...m, ...patch } : m) });
  const deleteMeasurement = (id) => update({ takeoffMeasurements: takeoffMeasurements.filter(m => m.id !== id) });
  const setPageMeta = (sheetId, page, patch) => update({
    takeoffSheets: takeoffSheets.map(s => s.id === sheetId
      ? { ...s, pages: { ...(s.pages || {}), [page]: { ...(s.pages?.[page] || { name: "", included: true }), ...patch } } }
      : s)
  });
  const setSheetTotalPages = (sheetId, totalPages) => update({ takeoffSheets: takeoffSheets.map(s => s.id === sheetId ? { ...s, totalPages } : s) });

  const quantitySummary = useMemo(() => {
    const groups = {};
    takeoffMeasurements.forEach(m => {
      const key = m.label + "|" + m.unit;
      groups[key] = groups[key] || { label: m.label, unit: m.unit, total: 0 };
      groups[key].total += Number(m.value) || 0;
    });
    return Object.values(groups).map(g => {
      const priceItem = (priceBook || []).find(p => p.name.toLowerCase() === g.label.toLowerCase() && p.unit === g.unit);
      return { ...g, unitCost: priceItem?.unitCost ?? null, cost: priceItem ? g.total * priceItem.unitCost : null };
    });
  }, [takeoffMeasurements, priceBook]);

  const sendQuantityToExpenses = (q) => {
    update({
      expenses: [...(job.expenses || []), {
        id: uid(), category: "Materials", description: `${q.label} (${q.total.toLocaleString()} ${q.unit} from takeoff)`,
        amount: Math.round(q.cost * 100) / 100, date: todayStr(), receipt: null,
      }],
    });
  };

  const expenseTotals = useMemo(() => {
    const list = job.expenses || [];
    const byCat = { Labor: 0, Materials: 0, Other: 0 };
    list.forEach(e => { byCat[e.category] = (byCat[e.category] || 0) + (Number(e.amount) || 0); });
    const total = Object.values(byCat).reduce((s, v) => s + v, 0);
    const revenue = Number(job.estimate?.amount) || 0;
    const profit = revenue - total;
    const margin = revenue > 0 ? Math.round((profit / revenue) * 100) : 0;
    return { byCat, total, revenue, profit, margin };
  }, [job.expenses, job.estimate]);

  const tabs = [
    { id: "details", label: "Details", icon: IFile },
    { id: "pnl", label: "P&L", icon: IDollar },
    { id: "takeoff", label: "Takeoff", icon: IRuler },
    { id: "tasks", label: "Tasks", icon: IList },
    { id: "schedule", label: "Schedule", icon: ICal },
  ];

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(26,35,50,0.55)" }}>
      <div className="bg-white rounded-sm w-full max-w-lg max-h-[88vh] overflow-hidden flex flex-col">
        <div className="p-4 border-b flex items-start justify-between" style={{ borderColor: "#EEEDE6" }}>
          <div className="flex-1 min-w-0">
            <input value={job.name} onChange={(e) => update({ name: e.target.value })} style={{ fontFamily: "'Oswald', sans-serif" }} className="uppercase font-semibold text-lg w-full outline-none" />
            <select value={job.status} onChange={(e) => update({ status: e.target.value })} className="text-xs px-1.5 py-0.5 border rounded-sm bg-white mt-1" style={{ borderColor: "#C9C5B8", color: STATUS_COLOR[job.status] }}>
              {STATUSES.map(s => <option key={s} value={s}>{s}</option>)}
            </select>
          </div>
          <button onClick={onClose} className="ml-2 shrink-0"><IX size={20} /></button>
        </div>
        <div className="flex border-b" style={{ borderColor: "#EEEDE6" }}>
          {tabs.map(t => (
            <button key={t.id} onClick={() => setTab(t.id)} className="flex-1 flex items-center justify-center gap-1.5 py-2.5 text-xs font-semibold uppercase tracking-wide"
              style={{ color: tab === t.id ? "#1A2332" : "#8A8577", borderBottom: tab === t.id ? "2px solid #E2600C" : "2px solid transparent" }}>
              <t.icon size={13} /> {t.label}
            </button>
          ))}
        </div>
        <div className="p-4 overflow-y-auto flex-1">
          {tab === "details" && (
            <div className="space-y-3">
              <div><label className="text-[11px] uppercase tracking-wide font-semibold" style={{ color: "#5B6470" }}>Client</label>
                <input value={job.client} onChange={(e) => update({ client: e.target.value })} className="w-full mt-1 px-2.5 py-2 border rounded-sm text-sm" style={{ borderColor: "#C9C5B8" }} /></div>
              <div><label className="text-[11px] uppercase tracking-wide font-semibold" style={{ color: "#5B6470" }}>Site address</label>
                <input value={job.address} onChange={(e) => update({ address: e.target.value })} className="w-full mt-1 px-2.5 py-2 border rounded-sm text-sm" style={{ borderColor: "#C9C5B8" }} /></div>
              <div><label className="text-[11px] uppercase tracking-wide font-semibold" style={{ color: "#5B6470" }}>Crew / assigned to</label>
                <input value={job.crew || ""} onChange={(e) => update({ crew: e.target.value })} placeholder="e.g. Dave, Marco" className="w-full mt-1 px-2.5 py-2 border rounded-sm text-sm" style={{ borderColor: "#C9C5B8" }} /></div>
              <div className="grid grid-cols-2 gap-3">
                <div><label className="text-[11px] uppercase tracking-wide font-semibold" style={{ color: "#5B6470" }}>Start</label>
                  <input type="date" value={job.startDate || ""} onChange={(e) => update({ startDate: e.target.value })} className="w-full mt-1 px-2.5 py-2 border rounded-sm text-sm" style={{ borderColor: "#C9C5B8" }} /></div>
                <div><label className="text-[11px] uppercase tracking-wide font-semibold" style={{ color: "#5B6470" }}>Due</label>
                  <input type="date" value={job.dueDate || ""} onChange={(e) => update({ dueDate: e.target.value })} className="w-full mt-1 px-2.5 py-2 border rounded-sm text-sm" style={{ borderColor: "#C9C5B8" }} /></div>
              </div>
              <div className="pt-2">
                <label className="text-[11px] uppercase tracking-wide font-semibold" style={{ color: "#5B6470" }}>Progress</label>
                <input type="range" min="0" max="100" value={job.progress || 0} onChange={(e) => update({ progress: Number(e.target.value) })} className="w-full mt-1" />
                <Gauge value={job.progress || 0} color={STATUS_COLOR[job.status]} />
              </div>
              <div className="border-t pt-3" style={{ borderColor: "#EEEDE6" }}>
                <label className="text-[11px] uppercase tracking-wide font-semibold" style={{ color: "#5B6470" }}>Estimate</label>
                <div className="grid grid-cols-2 gap-3 mt-1">
                  <input type="number" value={job.estimate?.amount ?? 0} onChange={(e) => update({ estimate: { ...job.estimate, amount: Number(e.target.value) || 0 } })} className="px-2.5 py-2 border rounded-sm text-sm" style={{ borderColor: "#C9C5B8" }} />
                  <select value={job.estimate?.status || "Draft"} onChange={(e) => update({ estimate: { ...job.estimate, status: e.target.value } })} className="px-2.5 py-2 border rounded-sm text-sm bg-white" style={{ borderColor: "#C9C5B8" }}>
                    {["Draft", "Sent", "Approved", "Rejected"].map(s => <option key={s}>{s}</option>)}
                  </select>
                </div>
              </div>
              <div><label className="text-[11px] uppercase tracking-wide font-semibold" style={{ color: "#5B6470" }}>Notes</label>
                <textarea value={job.notes || ""} onChange={(e) => update({ notes: e.target.value })} rows={3} className="w-full mt-1 px-2.5 py-2 border rounded-sm text-sm" style={{ borderColor: "#C9C5B8" }} /></div>
              <button onClick={() => { if (confirm("Delete this job? This can't be undone.")) onDelete(job.id); }} className="flex items-center gap-1.5 text-xs font-semibold mt-2" style={{ color: "#E2600C" }}>
                <ITrash size={13} /> Delete job
              </button>
            </div>
          )}
          {tab === "pnl" && (
            <div>
              {uploadError && (
                <div className="text-xs px-2.5 py-2 rounded-sm mb-3" style={{ background: "#FBEAE0", color: "#B4460A" }}>{uploadError}</div>
              )}

              <div className="grid grid-cols-2 gap-2.5 mb-4">
                <div className="bg-white border rounded-sm p-2.5" style={{ borderColor: "#E4E1D6" }}>
                  <div className="text-[10px] uppercase tracking-wide font-semibold" style={{ color: "#8A8577" }}>Revenue (estimate)</div>
                  <div style={{ fontFamily: "'IBM Plex Mono', monospace" }} className="text-lg font-semibold">{fmtMoney(expenseTotals.revenue)}</div>
                </div>
                <div className="bg-white border rounded-sm p-2.5" style={{ borderColor: "#E4E1D6" }}>
                  <div className="text-[10px] uppercase tracking-wide font-semibold" style={{ color: "#8A8577" }}>Total expenses</div>
                  <div style={{ fontFamily: "'IBM Plex Mono', monospace" }} className="text-lg font-semibold">{fmtMoney(expenseTotals.total)}</div>
                </div>
                <div className="bg-white border rounded-sm p-2.5" style={{ borderColor: "#E4E1D6" }}>
                  <div className="text-[10px] uppercase tracking-wide font-semibold" style={{ color: "#8A8577" }}>Net profit</div>
                  <div style={{ fontFamily: "'IBM Plex Mono', monospace", color: expenseTotals.profit >= 0 ? "#4A7856" : "#E2600C" }} className="text-lg font-semibold">{fmtMoney(expenseTotals.profit)}</div>
                </div>
                <div className="bg-white border rounded-sm p-2.5" style={{ borderColor: "#E4E1D6" }}>
                  <div className="text-[10px] uppercase tracking-wide font-semibold" style={{ color: "#8A8577" }}>Margin</div>
                  <div style={{ fontFamily: "'IBM Plex Mono', monospace", color: expenseTotals.margin >= 0 ? "#4A7856" : "#E2600C" }} className="text-lg font-semibold">{expenseTotals.margin}%</div>
                </div>
              </div>

              <div className="flex gap-3 mb-4 text-[11px]">
                {EXPENSE_CATEGORIES.map(c => (
                  <div key={c} className="flex items-center gap-1.5">
                    <span className="w-2 h-2 rounded-full" style={{ background: EXPENSE_COLOR[c] }} />
                    <span style={{ color: "#5B6470" }}>{c}: <span style={{ fontFamily: "'IBM Plex Mono', monospace" }}>{fmtMoney(expenseTotals.byCat[c])}</span></span>
                  </div>
                ))}
              </div>

              <div className="border-t pt-3 mb-4" style={{ borderColor: "#EEEDE6" }}>
                <label className="text-[11px] uppercase tracking-wide font-semibold" style={{ color: "#5B6470" }}>Add expense</label>
                <div className="grid grid-cols-2 gap-2 mt-1.5">
                  <select value={newExpense.category} onChange={(e) => setNewExpense(f => ({ ...f, category: e.target.value }))}
                    className="px-2.5 py-2 border rounded-sm text-sm bg-white" style={{ borderColor: "#C9C5B8" }}>
                    {EXPENSE_CATEGORIES.map(c => <option key={c}>{c}</option>)}
                  </select>
                  <input type="date" value={newExpense.date} onChange={(e) => setNewExpense(f => ({ ...f, date: e.target.value }))}
                    className="px-2.5 py-2 border rounded-sm text-sm" style={{ borderColor: "#C9C5B8" }} />
                  <input value={newExpense.description} onChange={(e) => setNewExpense(f => ({ ...f, description: e.target.value }))} placeholder="Description"
                    className="col-span-2 px-2.5 py-2 border rounded-sm text-sm" style={{ borderColor: "#C9C5B8" }} />
                  <input type="number" value={newExpense.amount} onChange={(e) => setNewExpense(f => ({ ...f, amount: e.target.value }))} placeholder="Amount ($)"
                    className="px-2.5 py-2 border rounded-sm text-sm" style={{ borderColor: "#C9C5B8" }} />
                  <button onClick={addExpense} className="px-3 py-2 rounded-sm text-white text-xs font-semibold uppercase tracking-wide" style={{ background: "#2B5D8C" }}>Add</button>
                </div>
              </div>

              {(!job.expenses || job.expenses.length === 0) ? (
                <EmptyState icon={IDollar} title="No expenses logged" subtitle="Add labor and material costs above to track this job's margin." />
              ) : (
                <div className="space-y-1.5 mb-5">
                  {job.expenses.slice().sort((a, b) => (b.date || "").localeCompare(a.date || "")).map(exp => (
                    <div key={exp.id} className="flex items-center gap-2 px-2.5 py-2 border rounded-sm" style={{ borderColor: "#EEEDE6" }}>
                      <span className="w-1.5 h-1.5 rounded-full shrink-0" style={{ background: EXPENSE_COLOR[exp.category] }} />
                      <div className="flex-1 min-w-0">
                        <div className="text-sm truncate">{exp.description}</div>
                        <div className="text-[11px]" style={{ color: "#8A8577" }}>{exp.category} · {fmtDate(exp.date)}</div>
                      </div>
                      <div style={{ fontFamily: "'IBM Plex Mono', monospace" }} className="text-sm shrink-0">{fmtMoney(exp.amount)}</div>
                      {exp.receipt ? (
                        <a href={exp.receipt.url} target="_blank" rel="noreferrer" className="shrink-0" title="View receipt">
                          <ICamera size={14} color="#4A7856" />
                        </a>
                      ) : (
                        <label className="shrink-0 cursor-pointer" title="Attach receipt photo">
                          {uploadingExpenseReceipt === exp.id ? <span className="animate-spin inline-block"><ILoader size={14} color="#8A8577" /></span> : <ICamera size={14} color="#C9C5B8" />}
                          <input type="file" accept="image/*" className="hidden" onChange={(e) => { if (e.target.files?.[0]) attachReceipt(exp.id, e.target.files[0]); e.target.value = ""; }} />
                        </label>
                      )}
                      <button onClick={() => removeExpense(exp.id)}><IX size={14} color="#8A8577" /></button>
                    </div>
                  ))}
                </div>
              )}

              <div className="border-t pt-3" style={{ borderColor: "#EEEDE6" }}>
                <div className="flex items-center justify-between mb-2">
                  <label className="text-[11px] uppercase tracking-wide font-semibold" style={{ color: "#5B6470" }}>Project files & photos</label>
                  <button onClick={() => projectFileInputRef.current?.click()} disabled={uploadingFile}
                    className="flex items-center gap-1 text-[11px] font-semibold uppercase" style={{ color: "#2B5D8C" }}>
                    {uploadingFile ? <span className="animate-spin"><ILoader size={12} /></span> : <IPaperclip size={12} />} Add file
                  </button>
                  <input type="file" ref={projectFileInputRef} className="hidden" onChange={(e) => { if (e.target.files?.[0]) addProjectFile(e.target.files[0]); e.target.value = ""; }} />
                </div>
                {(!job.files || job.files.length === 0) ? (
                  <EmptyState icon={IPaperclip} title="No files yet" subtitle="Add plan sheets, takeoffs, or job-site photos." />
                ) : (
                  <div className="grid grid-cols-3 gap-2">
                    {job.files.map(f => (
                      <div key={f.id} className="relative border rounded-sm overflow-hidden group" style={{ borderColor: "#E4E1D6" }}>
                        {f.type?.startsWith("image/") ? (
                          <a href={f.url} target="_blank" rel="noreferrer"><img src={f.url} alt={f.name} className="w-full h-20 object-cover" /></a>
                        ) : (
                          <a href={f.url} target="_blank" rel="noreferrer" className="flex flex-col items-center justify-center h-20 text-center px-1" style={{ color: "#5B6470" }}>
                            <IFile size={18} /><span className="text-[9px] truncate w-full mt-1">{f.name}</span>
                          </a>
                        )}
                        <button onClick={() => removeProjectFile(f.id)} className="absolute top-0.5 right-0.5 bg-white/90 rounded-sm p-0.5"><IX size={11} color="#8A8577" /></button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          )}
          {tab === "takeoff" && (
            <div>
              {uploadError && (
                <div className="text-xs px-2.5 py-2 rounded-sm mb-3" style={{ background: "#FBEAE0", color: "#B4460A" }}>{uploadError}</div>
              )}
              <div className="flex items-center justify-between mb-2">
                <label className="text-[11px] uppercase tracking-wide font-semibold" style={{ color: "#5B6470" }}>Plan sheets</label>
                <button onClick={() => sheetInputRef.current?.click()} disabled={uploadingSheet}
                  className="flex items-center gap-1 text-[11px] font-semibold uppercase" style={{ color: "#2B5D8C" }}>
                  {uploadingSheet ? <span className="animate-spin"><ILoader size={12} /></span> : <IPlus size={12} />} Add pages
                </button>
                <input type="file" accept="image/*,application/pdf" ref={sheetInputRef} className="hidden"
                  onChange={(e) => { if (e.target.files?.[0]) uploadSheet(e.target.files[0]); e.target.value = ""; }} />
              </div>

              {takeoffSheets.length === 0 ? (
                <EmptyState icon={IRuler} title="No plan sheets yet" subtitle="Upload a PDF or image of a plan sheet to start measuring quantities." />

                <div className="space-y-1.5 mb-4">
                  {takeoffSheets.map(s => (
                    <div key={s.id} className="flex items-center gap-2 px-2.5 py-2 border rounded-sm" style={{ borderColor: "#EEEDE6" }}>
                      <IFile size={14} color="#8A8577" />
                      <span className="flex-1 text-sm truncate">{s.name}</span>
                      <span className="text-[10px] uppercase px-1.5 py-0.5 rounded-sm shrink-0" style={{ background: (s.pixelsPerFoot || Object.keys(s.scales || {}).length) ? "#E8F3EC" : "#FBEAE0", color: (s.pixelsPerFoot || Object.keys(s.scales || {}).length) ? "#4A7856" : "#B4460A" }}>
                        {(s.pixelsPerFoot || Object.keys(s.scales || {}).length) ? "Calibrated" : "Not calibrated"}
                      </span>
                      <button onClick={() => setActiveSheetId(s.id)} className="text-[11px] font-semibold uppercase shrink-0" style={{ color: "#2B5D8C" }}>Open</button>
                      <button onClick={() => removeSheet(s.id)}><IX size={14} color="#8A8577" /></button>
                    </div>
                  ))}
                </div>
              )}

              <div className="border-t pt-3" style={{ borderColor: "#EEEDE6" }}>
                <label className="text-[11px] uppercase tracking-wide font-semibold" style={{ color: "#5B6470" }}>Quantities</label>
                {quantitySummary.length === 0 ? (
                  <div className="text-xs mt-2" style={{ color: "#8A8577" }}>Measurements you take on a sheet will summarize here.</div>
                ) : (
                  <div className="mt-2 space-y-1">
                    {quantitySummary.map(q => (
                      <div key={q.label + q.unit} className="flex items-center justify-between text-sm px-2.5 py-1.5 border-b" style={{ borderColor: "#EEEDE6" }}>
                        <span className="flex-1 min-w-0 truncate">{q.label}</span>
                        <span style={{ fontFamily: "'IBM Plex Mono', monospace" }} className="shrink-0">{q.total.toLocaleString()} {q.unit}</span>
                        {q.cost != null ? (
                          <>
                            <span style={{ fontFamily: "'IBM Plex Mono', monospace", color: "#4A7856" }} className="shrink-0 ml-3">{fmtMoney(q.cost)}</span>
                            <button onClick={() => sendQuantityToExpenses(q)} title="Add this cost to Materials expenses"
                              className="shrink-0 ml-2 text-[10px] font-semibold uppercase" style={{ color: "#2B5D8C" }}>+ Expense</button>
                          </>
                        ) : (
                          <span className="shrink-0 ml-3 text-[10px]" style={{ color: "#C9C5B8" }}>no price set</span>
                        )}
                      </div>
                    ))}
                  </div>
                )}
                {takeoffMeasurements.length > 0 && (
                  <details className="mt-3">
                    <summary className="text-[11px] cursor-pointer" style={{ color: "#8A8577" }}>Show individual measurements ({takeoffMeasurements.length})</summary>
                    <div className="mt-2 space-y-1">
                      {takeoffMeasurements.map(m => (
                        <div key={m.id} className="flex items-center gap-2 text-[11px] px-2 py-1">
                          <span className="flex-1 truncate">{m.label} <span style={{ color: "#8A8577" }}>· {m.sheetName}</span></span>
                          <span style={{ fontFamily: "'IBM Plex Mono', monospace" }}>{m.value} {m.unit}</span>
                          <button onClick={() => deleteMeasurement(m.id)}><IX size={12} color="#8A8577" /></button>
                        </div>
                      ))}
                    </div>
                  </details>
                )}
              </div>
            </div>
          )}
          {tab === "tasks" && (
            <div>
              <div className="flex gap-2 mb-3">
                <input value={newTask} onChange={(e) => setNewTask(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addTask()} placeholder="Add a task…" className="flex-1 px-2.5 py-2 border rounded-sm text-sm" style={{ borderColor: "#C9C5B8" }} />
                <input value={newTaskAssignee} onChange={(e) => setNewTaskAssignee(e.target.value)} placeholder="Who" className="w-20 px-2 py-2 border rounded-sm text-sm" style={{ borderColor: "#C9C5B8" }} />
                <button onClick={addTask} className="px-3 rounded-sm text-white" style={{ background: "#2B5D8C" }}><IPlus size={16} /></button>
              </div>
              {(!job.tasks || job.tasks.length === 0) ? (
                <EmptyState icon={IList} title="No tasks yet" subtitle="Add the first punch-list item above." />
              ) : (
                <div className="space-y-1.5">
                  {job.tasks.map(t => (
                    <div key={t.id} className="flex items-center gap-2 px-2.5 py-2 border rounded-sm" style={{ borderColor: "#EEEDE6" }}>
                      <button onClick={() => toggleTask(t.id)} className="w-4 h-4 shrink-0 rounded-sm border flex items-center justify-center" style={{ borderColor: t.done ? "#4A7856" : "#C9C5B8", background: t.done ? "#4A7856" : "white" }}>
                        {t.done && <ICheck size={11} color="white" />}
                      </button>
                      <span className={"flex-1 text-sm " + (t.done ? "line-through" : "")} style={{ color: t.done ? "#8A8577" : "#1A2332" }}>{t.text}</span>
                      {t.assignee && <span className="text-[11px]" style={{ color: "#8A8577" }}>{t.assignee}</span>}
                      <button onClick={() => removeTask(t.id)}><IX size={14} color="#8A8577" /></button>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
          {tab === "schedule" && (
            <div>
              <div className="grid grid-cols-2 gap-2 mb-2">
                <input value={newAppt.title} onChange={(e) => setNewAppt(a => ({ ...a, title: e.target.value }))} placeholder="Appointment title" className="col-span-2 px-2.5 py-2 border rounded-sm text-sm" style={{ borderColor: "#C9C5B8" }} />
                <input type="date" value={newAppt.date} onChange={(e) => setNewAppt(a => ({ ...a, date: e.target.value }))} className="px-2.5 py-2 border rounded-sm text-sm" style={{ borderColor: "#C9C5B8" }} />
                <input type="time" value={newAppt.time} onChange={(e) => setNewAppt(a => ({ ...a, time: e.target.value }))} className="px-2.5 py-2 border rounded-sm text-sm" style={{ borderColor: "#C9C5B8" }} />
                <select value={newAppt.type} onChange={(e) => setNewAppt(a => ({ ...a, type: e.target.value }))} className="col-span-2 px-2.5 py-2 border rounded-sm text-sm bg-white" style={{ borderColor: "#C9C5B8" }}>
                  {APPT_TYPES.map(t => <option key={t}>{t}</option>)}
                </select>
              </div>
              <button onClick={addAppt} className="w-full py-2 rounded-sm text-white text-xs font-semibold uppercase tracking-wide mb-3" style={{ background: "#2B5D8C" }}>Add appointment</button>
              {(!job.appointments || job.appointments.length === 0) ? (
                <EmptyState icon={ICal} title="Nothing scheduled" subtitle="Add a site visit, inspection, or install date." />
              ) : (
                <div className="space-y-1.5">
                  {job.appointments.slice().sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time)).map(a => (
                    <div key={a.id} className="flex items-center gap-2 px-2.5 py-2 border rounded-sm" style={{ borderColor: "#EEEDE6" }}>
                      <div style={{ fontFamily: "'IBM Plex Mono', monospace" }} className="text-[11px] w-16 shrink-0">{fmtDate(a.date)} {a.time}</div>
                      <span className="flex-1 text-sm">{a.title}</span>
                      <span className="text-[10px] uppercase px-1.5 py-0.5 rounded-sm" style={{ background: "#EEEDE6", color: "#5B6470" }}>{a.type}</span>
                      <button onClick={() => removeAppt(a.id)}><IX size={14} color="#8A8577" /></button>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>
      </div>

      {activeSheetId && (
        <TakeoffCanvas
          sheets={takeoffSheets}
          initialSheetId={activeSheetId}
          measurements={takeoffMeasurements}
          onClose={() => setActiveSheetId(null)}
          onSetScale={setSheetScale}
          onSetSheetTotalPages={setSheetTotalPages}
          onSetPageMeta={setPageMeta}
          onSaveMeasurement={saveMeasurement}
          onUpdateMeasurement={updateMeasurement}
          onDeleteMeasurement={deleteMeasurement}
          onUploadSheet={uploadSheet}
          priceBook={priceBook}
          classes={takeoffClasses}
          onAddClass={addClass}
          onDeleteClass={deleteClass}
        />
      )}
    </div>
  );
}

function TakeoffCanvas({ sheets, initialSheetId, measurements, onClose, onSetScale, onSetSheetTotalPages, onSetPageMeta, onSaveMeasurement, onUpdateMeasurement, onDeleteMeasurement, onUploadSheet, priceBook, classes, onAddClass, onDeleteClass }) {
  const [imgError, setImgError] = useState("");
  const [imgReady, setImgReady] = useState(false);
  const [naturalW, setNaturalW] = useState(0);
  const [naturalH, setNaturalH] = useState(0);
  const [zoom, setZoom] = useState(1);
  const [mode, setMode] = useState(null); // null | select | calibrate | line | area | count
  const [points, setPoints] = useState([]);
  const [pendingCalibration, setPendingCalibration] = useState(null);
  const [calibrationFeet, setCalibrationFeet] = useState("");
  const [labelForm, setLabelForm] = useState(null);
  const [selectedClassId, setSelectedClassId] = useState(null);
  const [newClassName, setNewClassName] = useState("");
  const [hiddenClassIds, setHiddenClassIds] = useState(() => new Set());
  const [currentSheetId, setCurrentSheetId] = useState(initialSheetId);
  const [currentPage, setCurrentPage] = useState(1);
  const [thumbnails, setThumbnails] = useState({}); // `${sheetId}:${page}` -> dataUrl | "loading" | "error"
  const [pagesPanelOpen, setPagesPanelOpen] = useState(true);
  const [pagesFilter, setPagesFilter] = useState("all"); // all | inuse
  const [selectedMeasurementId, setSelectedMeasurementId] = useState(null);
  const [dragState, setDragState] = useState(null); // { measurementId, pointIndex, x, y }
  const [worksheetOpen, setWorksheetOpen] = useState(false);
  const [sortKey, setSortKey] = useState("sheetName");
  const [sortDir, setSortDir] = useState("asc");

  const sheetFileInputRef = useRef(null);
  const canvasRef = useRef(null);
  const containerRef = useRef(null);
  const imgElRef = useRef(null);

  const currentSheet = sheets.find(s => s.id === currentSheetId) || sheets[0];
  const isPdf = currentSheet && ((currentSheet.type || "").includes("pdf") || (currentSheet.name || "").toLowerCase().endsWith(".pdf"));
  const totalPages = currentSheet?.totalPages || 1;
  // Scale is stored per page — different sheets/pages in a plan set are often at different scales.
  const currentScale = currentSheet?.scales?.[currentPage] ?? (currentPage === 1 ? currentSheet?.pixelsPerFoot : undefined);
  const pageMeasurements = measurements.filter(m => m.sheetId === currentSheetId && (m.page || 1) === currentPage);
  const visibleMeasurements = pageMeasurements.filter(m => !hiddenClassIds.has(m.classId));
  const unitForMode = mode === "area" ? "sq ft" : mode === "count" ? "count" : "ft";
  const classesForMode = (classes || []).filter(c => c.unit === unitForMode);

  const toggleClassVisibility = (id) => setHiddenClassIds(prev => {
    const next = new Set(prev);
    next.has(id) ? next.delete(id) : next.add(id);
    return next;
  });

  const classTotals = useMemo(() => {
    const totals = {};
    pageMeasurements.forEach(m => { if (m.classId) totals[m.classId] = (totals[m.classId] || 0) + (Number(m.value) || 0); });
    return totals;
  }, [pageMeasurements]);

  // Ensure every sheet's page count is known, then lazily render a small thumbnail
  // for each PDF page (images are shown directly, no pre-render needed). Runs once
  // per change to the set of sheets, not on every thumbnail — avoids re-triggering itself.
  useEffect(() => {
    let cancelled = false;
    (async () => {
      for (const s of sheets) {
        const sIsPdf = (s.type || "").includes("pdf") || (s.name || "").toLowerCase().endsWith(".pdf");
        let count = s.totalPages;
        if (!count) {
          if (sIsPdf) {
            try { count = (await loadPdfDoc(s.url)).numPages; } catch (e) { count = 1; }
          } else count = 1;
          if (cancelled) return;
          onSetSheetTotalPages(s.id, count);
        }
        if (sIsPdf) {
          for (let p = 1; p <= Math.min(count, 50); p++) {
            const key = `${s.id}:${p}`;
            if (thumbnails[key]) continue;
            setThumbnails(t => ({ ...t, [key]: "loading" }));
            try {
              const { dataUrl } = await renderPdfPageToDataUrl(s.url, p, 0.25);
              if (cancelled) return;
              setThumbnails(t => ({ ...t, [key]: dataUrl }));
            } catch (e) {
              if (!cancelled) setThumbnails(t => ({ ...t, [key]: "error" }));
            }
          }
        }
      }
    })();
    return () => { cancelled = true; };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [sheets.map(s => s.id).join(",")]);

  // Load the current page into the main canvas — render PDFs to an image, use uploaded images directly.
  useEffect(() => {
    if (!currentSheet) return;
    let cancelled = false;
    setImgReady(false); setImgError(""); setMode(null); setPoints([]); setSelectedMeasurementId(null);
    (async () => {
      try {
        const src = isPdf ? (await renderPdfPageToDataUrl(currentSheet.url, currentPage)).dataUrl : currentSheet.url;
        const img = new Image();
        img.onload = () => {
          if (cancelled) return;
          imgElRef.current = img;
          setNaturalW(img.naturalWidth); setNaturalH(img.naturalHeight);
          const containerWidth = containerRef.current?.clientWidth || 800;
          setZoom(Math.min(1, (containerWidth - 32) / img.naturalWidth));
          setImgReady(true);
        };
        img.onerror = () => { if (!cancelled) setImgError("Couldn't load the image for this sheet."); };
        img.src = src;
      } catch (e) {
        if (!cancelled) setImgError(e.message || "Couldn't load this sheet.");
      }
    })();
    return () => { cancelled = true; };
  }, [currentSheetId, currentPage]);

  const draw = useCallback(() => {
    const canvas = canvasRef.current, img = imgElRef.current;
    if (!canvas || !img || !naturalW) return;
    canvas.width = naturalW * zoom; canvas.height = naturalH * zoom;
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save(); ctx.scale(zoom, zoom);
    ctx.drawImage(img, 0, 0, naturalW, naturalH);

    const drawShape = (pts, type, color, label, dashed) => {
      if (!pts.length) return;
      ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = (dashed ? 3 : 2) / zoom;
      ctx.setLineDash(dashed ? [6 / zoom, 4 / zoom] : []);
      if (type === "count") {
        pts.forEach((p, i) => {
          ctx.beginPath(); ctx.arc(p.x, p.y, 7 / zoom, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = "white"; ctx.font = (10 / zoom) + "px sans-serif"; ctx.textAlign = "center";
          ctx.fillText(String(i + 1), p.x, p.y + 3 / zoom);
          ctx.fillStyle = color;
        });
      } else {
        ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
        if (type === "area" && pts.length > 2) { ctx.closePath(); ctx.globalAlpha = 0.15; ctx.fill(); ctx.globalAlpha = 1; }
        ctx.stroke();
        pts.forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, 4 / zoom, 0, Math.PI * 2); ctx.fill(); });
      }
      ctx.setLineDash([]);
      if (label) {
        const mid = pts[Math.floor((pts.length - 1) / 2)];
        ctx.font = (13 / zoom) + "px sans-serif"; ctx.fillStyle = "#1A2332"; ctx.textAlign = "left";
        ctx.fillText(label, mid.x + 8 / zoom, mid.y - 8 / zoom);
      }
    };

    visibleMeasurements.forEach(m => {
      const cls = (classes || []).find(c => c.id === m.classId);
      const isDraggingThis = dragState && dragState.measurementId === m.id;
      const pts = isDraggingThis ? m.points.map((p, i) => i === dragState.pointIndex ? { x: dragState.x, y: dragState.y } : p) : m.points;
      drawShape(pts, m.type, cls?.color || "#2B5D8C", `${m.label} (${m.value} ${m.unit})`, m.id === selectedMeasurementId);
    });
    if (points.length) drawShape(points, mode === "calibrate" ? "line" : mode, "#E2600C", null);
    if (pendingCalibration) drawShape(pendingCalibration.points, "line", "#E2600C", null);
    ctx.restore();
  }, [naturalW, naturalH, zoom, points, mode, visibleMeasurements, classes, pendingCalibration, dragState, selectedMeasurementId]);

  useEffect(() => { if (imgReady) draw(); }, [imgReady, draw]);

  const undoLastPoint = () => setPoints(p => p.slice(0, -1));
  useEffect(() => {
    const onKeyDown = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === "z" && points.length > 0) { e.preventDefault(); undoLastPoint(); return; }
      if ((e.key === "Delete" || e.key === "Backspace") && mode === "select" && selectedMeasurementId) {
        e.preventDefault(); onDeleteMeasurement(selectedMeasurementId); setSelectedMeasurementId(null);
      }
    };
    window.addEventListener("keydown", onKeyDown);
    return () => window.removeEventListener("keydown", onKeyDown);
  }, [points.length, mode, selectedMeasurementId]);

  const SNAP_SCREEN_PX = 10;
  const findSnapPoint = (x, y) => {
    const thresholdNatural = SNAP_SCREEN_PX / zoom;
    const candidates = [];
    pageMeasurements.forEach(m => candidates.push(...m.points));
    candidates.push(...points);
    let best = null, bestDist = thresholdNatural;
    candidates.forEach(p => {
      const d = Math.hypot(p.x - x, p.y - y);
      if (d < bestDist) { bestDist = d; best = p; }
    });
    return best;
  };

  const getCanvasCoords = (e) => {
    const rect = canvasRef.current.getBoundingClientRect();
    return { x: (e.clientX - rect.left) / zoom, y: (e.clientY - rect.top) / zoom };
  };

  const handleClick = (e) => {
    if (mode === "select" || !mode || labelForm || pendingCalibration) return;
    const raw = getCanvasCoords(e);
    const snap = findSnapPoint(raw.x, raw.y);
    const { x, y } = snap || raw;
    if (mode === "calibrate") {
      const next = [...points, { x, y }];
      if (next.length === 2) { setPendingCalibration({ points: next, distancePx: polylineLength(next) }); setPoints([]); }
      else setPoints(next);
      return;
    }
    setPoints(p => [...p, { x, y }]);
  };

  const handleMouseDown = (e) => {
    if (mode !== "select") return;
    const { x, y } = getCanvasCoords(e);
    const threshold = 10 / zoom;
    let found = null, bestDist = threshold;
    pageMeasurements.forEach(m => {
      m.points.forEach((p, idx) => {
        const d = Math.hypot(p.x - x, p.y - y);
        if (d < bestDist) { bestDist = d; found = { measurementId: m.id, pointIndex: idx }; }
      });
    });
    if (found) {
      setDragState({ ...found, x, y });
      setSelectedMeasurementId(found.measurementId);
      return;
    }
    const hit = pageMeasurements.find(m => hitTestMeasurement(m, x, y, threshold));
    setSelectedMeasurementId(hit ? hit.id : null);
  };
  const handleMouseMove = (e) => {
    if (!dragState) return;
    const { x, y } = getCanvasCoords(e);
    setDragState(s => ({ ...s, x, y }));
  };
  const handleMouseUp = () => {
    if (!dragState) return;
    const m = measurements.find(mm => mm.id === dragState.measurementId);
    if (m) {
      const newPoints = m.points.map((p, i) => i === dragState.pointIndex ? { x: dragState.x, y: dragState.y } : p);
      let value = m.value;
      if (currentScale) {
        if (m.type === "line") value = Math.round((polylineLength(newPoints) / currentScale) * 10) / 10;
        else if (m.type === "area") value = Math.round((polygonArea(newPoints) / (currentScale ** 2)) * 10) / 10;
      }
      onUpdateMeasurement(m.id, { points: newPoints, value });
    }
    setDragState(null);
  };

  const minPoints = mode === "area" ? 3 : mode === "count" ? 1 : 2;
  const canFinish = mode && mode !== "calibrate" && mode !== "select" && points.length >= minPoints;

  const priceMatch = selectedClassId ? (() => {
    const cls = (classes || []).find(c => c.id === selectedClassId);
    return cls ? (priceBook || []).find(p => p.name.toLowerCase() === cls.name.toLowerCase() && p.unit === cls.unit) : null;
  })() : null;

  const handleFinish = () => {
    if (mode !== "count" && !currentScale) { alert("Calibrate this sheet's scale first (use the Calibrate tool)."); return; }
    const valuePx = mode === "area" ? polygonArea(points) : mode === "line" ? polylineLength(points) : points.length;
    setLabelForm({ type: mode, valuePx, points });
    setSelectedClassId(null); setNewClassName("");
  };
  const handleCancel = () => { setPoints([]); setMode(null); };

  const confirmLabel = () => {
    let cls = (classes || []).find(c => c.id === selectedClassId);
    if (!cls) {
      if (!newClassName.trim()) return;
      cls = onAddClass(newClassName, labelForm.type === "line" ? "ft" : labelForm.type === "area" ? "sq ft" : "count");
    }
    let value, unit;
    if (labelForm.type === "line") { value = Math.round((labelForm.valuePx / currentScale) * 10) / 10; unit = "ft"; }
    else if (labelForm.type === "area") { value = Math.round((labelForm.valuePx / (currentScale ** 2)) * 10) / 10; unit = "sq ft"; }
    else { value = labelForm.valuePx; unit = "count"; }
    const pageName = currentSheet.pages?.[currentPage]?.name;
    const sheetName = pageName || (totalPages > 1 ? `${currentSheet.name} (p${currentPage})` : currentSheet.name);
    onSaveMeasurement({ id: uid(), sheetId: currentSheetId, sheetName, page: currentPage, type: labelForm.type, classId: cls.id, label: cls.name, value, unit, points: labelForm.points });
    setLabelForm(null); setPoints([]); setMode(null); setSelectedClassId(null); setNewClassName("");
  };

  const confirmCalibration = () => {
    const feet = Number(calibrationFeet);
    if (!feet || feet <= 0) return;
    onSetScale(currentSheetId, currentPage, pendingCalibration.distancePx / feet);
    setPendingCalibration(null); setCalibrationFeet(""); setMode(null);
  };

  const toolBtn = (m, label, Ic) => (
    <button onClick={() => { setMode(mode === m ? null : m); setPoints([]); setSelectedMeasurementId(null); }}
      className="flex flex-col items-center gap-0.5 px-2.5 py-1.5 rounded-sm min-w-[52px]"
      style={{ background: mode === m ? "#1A2332" : "transparent", color: mode === m ? "white" : "#C9D2DC" }}>
      <Ic size={16} />
      <span className="text-[9px] uppercase tracking-wide font-semibold">{label}</span>
    </button>
  );

  const sortedAllMeasurements = useMemo(() => {
    const list = [...measurements];
    list.sort((a, b) => {
      let av = a[sortKey], bv = b[sortKey];
      if (typeof av === "string") av = av.toLowerCase();
      if (typeof bv === "string") bv = bv.toLowerCase();
      if (av == null) av = "";
      if (bv == null) bv = "";
      if (av < bv) return sortDir === "asc" ? -1 : 1;
      if (av > bv) return sortDir === "asc" ? 1 : -1;
      return 0;
    });
    return list;
  }, [measurements, sortKey, sortDir]);
  const toggleSort = (key) => { if (sortKey === key) setSortDir(d => d === "asc" ? "desc" : "asc"); else { setSortKey(key); setSortDir("asc"); } };
  const sortHeader = (key, label) => (
    <button onClick={() => toggleSort(key)} className="flex items-center gap-1 text-left">
      {label} {sortKey === key && <span>{sortDir === "asc" ? "▲" : "▼"}</span>}
    </button>
  );

  if (!currentSheet) return null;

  return (
    <div className="fixed inset-0 z-[60] flex flex-col" style={{ background: "#1A2332" }}>
      <div className="flex items-center justify-between px-4 py-2.5 shrink-0 border-b" style={{ borderColor: "#2B3A4D" }}>
        <div className="text-white text-sm font-semibold truncate pr-3">{currentSheet.name}{totalPages > 1 ? ` — page ${currentPage}/${totalPages}` : ""}</div>
        <div className="flex items-center gap-3 shrink-0">
          <span className="text-[11px]" style={{ color: currentScale ? "#8BD1A8" : "#E8B23D" }}>
            {currentScale ? "Scale set" : "Not calibrated"}
          </span>
          <button onClick={onClose} className="text-white p-1"><IX size={20} /></button>
        </div>
      </div>

      <div className="flex flex-wrap items-center gap-1 px-3 py-1.5 shrink-0 border-b" style={{ borderColor: "#2B3A4D" }}>
        {toolBtn("select", "Select", ISelect)}

      <div className="flex-1 flex overflow-hidden">
        {pagesPanelOpen && (

          <div className="text-[10px] uppercase tracking-wide font-semibold mb-2" style={{ color: "#8B96A5" }}>Classes (this page)</div>
          {(classes || []).length === 0 ? (
            <div className="text-[11px]" style={{ color: "#8B96A5" }}>Classes are created the first time you label a measurement.</div>

            <div className="space-y-1">
              {(classes || []).map(c => (

                  <button onClick={() => toggleClassVisibility(c.id)} className="shrink-0" title={hiddenClassIds.has(c.id) ? "Show" : "Hide"}>
                    {hiddenClassIds.has(c.id) ? <ICloseEye size={13} color="#8B96A5" /> : <IOpenEye size={13} color="#C9D2DC" />}
                  </button>
                  <span className="flex-1 min-w-0 truncate text-[11px] text-white">{c.name}</span>
                  <span style={{ fontFamily: "'IBM Plex Mono', monospace" }} className="text-[10px] shrink-0">
                    {(classTotals[c.id] || 0).toLocaleString()}{c.unit === "count" ? "" : ` ${c.unit}`}
                  </span>
                  <button onClick={() => onDeleteClass(c.id)} className="shrink-0"><IX size={11} color="#8B96A5" /></button>
                </div>

        </div>
      </div>

      <div className="flex justify-center shrink-0 -mt-3 relative z-10">
        <button onClick={() => setWorksheetOpen(o => !o)}
          className="flex items-center gap-1.5 px-4 py-1.5 rounded-t-sm text-xs font-semibold uppercase tracking-wide"

        </button>

      {worksheetOpen && (
        <div className="shrink-0 overflow-y-auto border-t" style={{ height: 220, background: "#1F2A3A", borderColor: "#2B3A4D" }}>
          {measurements.length === 0 ? (
            <div className="p-4 text-[11px]" style={{ color: "#8B96A5" }}>No measurements yet across any page.</div>
          ) : (
            <table className="w-full text-[11px] text-white">
              <thead className="sticky top-0" style={{ background: "#2B3A4D" }}>
                <tr>
                  <th className="text-left px-3 py-1.5 font-semibold">{sortHeader("label", "Class")}</th>
                  <th className="text-left px-3 py-1.5 font-semibold">{sortHeader("sheetName", "Page")}</th>
                  <th className="text-left px-3 py-1.5 font-semibold">{sortHeader("type", "Type")}</th>
                  <th className="text-right px-3 py-1.5 font-semibold">{sortHeader("value", "Value")}</th>
                  <th className="px-3 py-1.5"></th>
                </tr>
              </thead>
              <tbody>
                {sortedAllMeasurements.map(m => (
                  <tr key={m.id} className="border-t" style={{ borderColor: "#2B3A4D" }}>
                    <td className="px-3 py-1.5">{m.label}</td>
                    <td className="px-3 py-1.5" style={{ color: "#8B96A5" }}>{m.sheetName}</td>
                    <td className="px-3 py-1.5 capitalize" style={{ color: "#8B96A5" }}>{m.type}</td>
                    <td className="px-3 py-1.5 text-right" style={{ fontFamily: "'IBM Plex Mono', monospace" }}>{m.value} {m.unit}</td>
                    <td className="px-3 py-1.5 text-right"><button onClick={() => onDeleteMeasurement(m.id)}><IX size={12} color="#8B96A5" /></button></td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      )}

      {pendingCalibration && (
        <div className="absolute bottom-6 left-1/2 -translate-x-1/2 bg-white rounded-sm p-3 shadow-lg flex items-center gap-2">
          <span className="text-xs" style={{ color: "#5B6470" }}>That line represents how many feet?</span>
          <input autoFocus type="number" value={calibrationFeet} onChange={(e) => setCalibrationFeet(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && confirmCalibration()}
            className="w-20 px-2 py-1 border rounded-sm text-sm" style={{ borderColor: "#C9C5B8" }} />
          <button onClick={confirmCalibration} className="px-2.5 py-1 rounded-sm text-white text-xs font-semibold" style={{ background: "#2B5D8C" }}>Set scale</button>
          <button onClick={() => { setPendingCalibration(null); setCalibrationFeet(""); }}><IX size={14} color="#8A8577" /></button>
        </div>
      )}
      {labelForm && (
        <div className="absolute bottom-6 left-1/2 -translate-x-1/2 bg-white rounded-sm p-3 shadow-lg flex flex-col gap-2 max-w-md">
          <div className="flex items-center justify-between">
            <span className="text-xs" style={{ color: "#5B6470" }}>Assign this {labelForm.type} to a class:</span>
            <button onClick={() => { setLabelForm(null); setPoints([]); setMode(null); }}><IX size={14} color="#8A8577" /></button>
          </div>
          {classesForMode.length > 0 && (
            <div className="flex flex-wrap gap-1.5">
              {classesForMode.map(c => (
                <button key={c.id} onClick={() => { setSelectedClassId(c.id); setNewClassName(""); }}
                  className="flex items-center gap-1.5 px-2 py-1 rounded-sm text-xs"
                  style={{ background: selectedClassId === c.id ? c.color : "#EEEDE6", color: selectedClassId === c.id ? "white" : "#1A2332" }}>
                  <span className="w-2 h-2 rounded-full shrink-0" style={{ background: selectedClassId === c.id ? "white" : c.color }} />

                </button>

          )}
          <div className="flex items-center gap-2">
            <input value={newClassName} onChange={(e) => { setNewClassName(e.target.value); setSelectedClassId(null); }}
              onKeyDown={(e) => e.key === "Enter" && confirmLabel()} placeholder="+ New class name (e.g. Curb)"
              className="flex-1 px-2 py-1 border rounded-sm text-sm" style={{ borderColor: "#C9C5B8" }} />
            <button onClick={confirmLabel} disabled={!selectedClassId && !newClassName.trim()}
              className="px-2.5 py-1 rounded-sm text-white text-xs font-semibold disabled:opacity-40" style={{ background: "#4A7856" }}>Save</button>
